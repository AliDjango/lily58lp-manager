[project]
name = "lily58lp-manager"
version = "0.2.0"
description = "KDE tray manager for Lily58LP HID telemetry and keyboard layers"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "dbus-next>=0.2.3",
    "hid>=1.0.8",
    "psutil>=7.1.3",
    "PyQt6>=6.8",
    "qasync>=0.27.1",
    "requests>=2.32",
]

[project.scripts]
lily58lp-manager = "lily58lp_manager.app:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py314"
extend-exclude = ["archive", "tools"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
